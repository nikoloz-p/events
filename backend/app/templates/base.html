<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Events{% endblock %}</title>

    <link rel="stylesheet" href="/static/styles/style.css" />
    <link
      rel="icon"
      href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAY==ABCAbQADAAEAEgAAAA=="
    />
  </head>

  <div id="overlay"></div>

  <body class="{% block body_class %}{% endblock %}">
    <header class="header add_event_header">
      <div class="header_inner">
        <h1 class="logo">
          <a href="/">ლოგო</a>
        </h1>
        <img
          src="../static/assets/icons/burger_menu.svg"
          alt="Menu"
          id="burger_menu"
          class="burger_menu"
        />

        <nav class="header_nav" id="header_nav">
          <img
            src="../static/assets/icons/close_icon.svg"
            alt=""
            id="close_icon"
            class="close_icon"
          />
          <ul class="header_nav_list">
            <li class="header_nav_list_item">
              <a href="/">მთავარი</a>
            </li>

            {% if user and user.role == "admin" %}
            <li class="header_nav_list_item">
              <a href="/events/create">დამატება</a>
            </li>
            <li class="header_nav_list_item">
              <strong>{{ user.role }}</strong>
            </li>
            <li class="header_nav_list_item">
              <a href="/auth/logout" id="logout_btn" class="logout_btn"
                >გამოსვლა</a
              >
            </li>
            {% endif %}
          </ul>
        </nav>
      </div>
    </header>

    {% block content %}{% endblock %}
  </body>
</html>
